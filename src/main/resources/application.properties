# Server Configuration
server.port=8080

# Spring AI Ollama Configuration
# Make sure Ollama is running locally with: ollama serve
# And that you have a model pulled, e.g.: ollama pull llama3.2

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.1
spring.ai.ollama.chat.options.top-p=0.9

# Logging
logging.level.com.example.mathagent=INFO
logging.level.org.springframework.ai=DEBUG

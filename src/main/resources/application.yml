spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-3.5-turbo
          temperature: 0.0
          max-tokens: 1000
          top-p: 1.0

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    com.example.mathagent: DEBUG
    org.springframework.ai: INFO
    org.springframework.web: INFO

